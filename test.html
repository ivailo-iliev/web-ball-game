<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>iPhone Camera FPS Test</title>
  <style>
    body { margin: 0; padding: 16px; background: #111; color: #fff; font: 15px/1.5 system-ui, sans-serif; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    .controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
    label { display: grid; gap: 4px; }
    select, button { padding: 10px; font: inherit; }
    button { cursor: pointer; }
    video { width: 100%; max-height: 55dvh; object-fit: contain; background: #222; margin-top: 16px; }
    pre { padding: 12px; background: #222; white-space: pre-wrap; overflow-wrap: anywhere; }
    .note { color: #bbb; font-size: 13px; }
  </style>
</head>
<body>
  <h1>Camera FPS test</h1>
  <div class="controls">
    <label>Camera
      <select id="camera">
        <option value="user">Front</option>
        <option value="environment">Rear</option>
      </select>
    </label>
    <label>Resolution
      <select id="resolution">
        <option value="1280x720">1280 × 720</option>
        <option value="1920x1080">1920 × 1080</option>
        <option value="640x480">640 × 480</option>
      </select>
    </label>
    <label>Frame-rate constraint
      <select id="fps">
        <option value="minimum">60 FPS minimum</option>
        <option value="ideal">60 FPS ideal</option>
        <option value="exact">60 FPS exact</option>
        <option value="30">30 FPS ideal</option>
      </select>
    </label>
    <button id="start">Start camera</button>
    <button id="stop" disabled>Stop</button>
  </div>

  <video id="preview" autoplay muted playsinline></video>
  <pre id="results" aria-live="polite">Press Start camera.</pre>
  <div class="note">Standalone getUserMedia test. No WebGPU, workers, track cloning,
    secondary constraints, or game scripts. The displayed FPS is measured from
    video-frame callbacks; the camera FPS comes from MediaStreamTrack.getSettings().</div>

  <script>
    (() => {
      'use strict';

      const $ = id => document.getElementById(id);
      const video = $('preview');
      const results = $('results');
      const startButton = $('start');
      const stopButton = $('stop');
      let stream = null;
      let track = null;
      let callbackId = null;
      let pollId = null;
      let seenFrames = 0;
      let lastSample = 0;
      let observedFPS = 'measuring…';
      let requestedLabel = '';

      function stop() {
        if (pollId !== null) clearInterval(pollId);
        pollId = null;
        if (callbackId !== null && video.cancelVideoFrameCallback) {
          video.cancelVideoFrameCallback(callbackId);
        }
        callbackId = null;
        if (stream) stream.getTracks().forEach(t => t.stop());
        video.pause();
        video.srcObject = null;
        stream = track = null;
        startButton.disabled = false;
        stopButton.disabled = true;
      }

      function frameCallback() {
        if (!track) return;
        seenFrames++;
        callbackId = video.requestVideoFrameCallback(frameCallback);
      }

      function render() {
        if (!track) return;
        const settings = track.getSettings();
        let capabilities = {};
        try { capabilities = track.getCapabilities(); } catch (_) {}

        const elapsed = performance.now() - lastSample;
        if (elapsed >= 1800 && video.requestVideoFrameCallback) {
          observedFPS = (seenFrames * 1000 / elapsed).toFixed(1) + ' FPS';
          seenFrames = 0;
          lastSample = performance.now();
        }

        const range = capabilities.frameRate;
        results.textContent = [
          'Requested: ' + requestedLabel,
          'Negotiated: ' + (settings.width ?? '?') + ' × ' +
            (settings.height ?? '?') + ' @ ' + (settings.frameRate ?? '?') + ' FPS',
          'Reported FPS capability: ' +
            (range ? range.min + '–' + range.max : 'unavailable'),
          'Observed video frames: ' +
            (video.requestVideoFrameCallback ? observedFPS : 'API unavailable'),
          'Track state: ' + track.readyState,
          'Actual track constraints: ' + JSON.stringify(track.getConstraints())
        ].join('\n');
      }

      startButton.addEventListener('click', async () => {
        stop();
        startButton.disabled = true;
        results.textContent = 'Requesting camera…';
        const [width, height] = $('resolution').value.split('x').map(Number);
        const facingMode = $('camera').value;
        const mode = $('fps').value;
        const frameRate = mode === 'minimum' ? { min: 60, ideal: 60 }
          : mode === 'exact' ? { exact: 60 }
          : { ideal: mode === '30' ? 30 : 60 };

        requestedLabel = facingMode + ', ' + width + ' × ' + height +
          ', ' + JSON.stringify(frameRate);
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            audio: false,
            video: {
              facingMode: { ideal: facingMode },
              width: { ideal: width },
              height: { ideal: height },
              frameRate
            }
          });
          track = stream.getVideoTracks()[0];
          video.srcObject = stream;
          await video.play();
          stopButton.disabled = false;
          seenFrames = 0;
          lastSample = performance.now();
          observedFPS = 'measuring…';
          if (video.requestVideoFrameCallback) {
            callbackId = video.requestVideoFrameCallback(frameCallback);
          }
          render();
          pollId = setInterval(render, 500);
        } catch (error) {
          results.textContent = 'Request failed: ' + error.name + ': ' + error.message;
          stop();
        }
      });

      stopButton.addEventListener('click', () => {
        stop();
        results.textContent = 'Stopped.';
      });
      window.addEventListener('pagehide', stop);
    })();
  </script>
</body>
</html>
